apiVersion: 1

datasources:
  - name: Warehouse PostgreSQL
    type: postgres
    access: proxy
    url: warehouse_db:5432
    database: warehouse
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1200
      timescaledb: false
    isDefault: true
    editable: true